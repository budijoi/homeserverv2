x-restart: &restart
  restart: unless-stopped

x-network: &network
  networks:
    - homeserver

services:
  # ==========================================
  # DASHBOARD MONITOR + BLOG
  # ==========================================
  dashboard:
    build: ./dashboard
    ports:
      - "8080:8080"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /storage/Blog:/app/blog_content:ro
      - ./dashboard/templates:/app/templates:ro
    environment:
      - HOST_PREFIX=/host
      - TZ=${TZ:-Asia/Jakarta}
    mem_limit: 128m
    <<: [*restart, *network]

  # ==========================================
  # FILEBROWSER
  # ==========================================
  filebrowser:
    image: filebrowser/filebrowser:latest
    ports:
      - "8081:80"
    volumes:
      - /storage:/srv
      - ./configs/filebrowser.json:/config/settings.json:ro
      - ./configs/filebrowser-data:/database
      - ./dashboard/templates:/srv/Dashboard:ro
    mem_limit: 64m
    <<: [*restart, *network]

  # ==========================================
  # CLOUDFLARE TUNNEL
  # ==========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    volumes:
      - ./configs/cloudflared:/home/nonroot/.cloudflared
    mem_limit: 64m
    <<: [*restart, *network]

  # ==========================================
  # TTYD + BTOP (Terminal via Web)
  # ==========================================
  ttyd:
    build: ./ttyd
    command: ttyd -p 7681 -c ${TTYD_USER:-admin}:${TTYD_PASS:-admin12345678} btop
    ports:
      - "7681:7681"
    pid: "host"
    mem_limit: 64m
    <<: [*restart, *network]

networks:
  homeserver:
    driver: bridge
