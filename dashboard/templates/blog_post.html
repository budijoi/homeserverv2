<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ post.title }} - My Home Server</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0e17;color:#e0e6ed;padding:20px}
.container{max-width:800px;margin:0 auto}
.header{text-align:center;padding:30px 20px;background:linear-gradient(135deg,#131a2b,#1a2340);border-radius:16px;margin-bottom:24px;border:1px solid #1e2a45}
.header h1{font-size:1.5em;background:linear-gradient(135deg,#00d4ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .date{color:#5a6a8a;font-size:.82em;margin-top:8px}
.nav-link{display:inline-block;margin-top:10px;color:#00d4ff;text-decoration:none;font-size:.85em}
.nav-link:hover{color:#00ff88}
.content{background:#131a2b;border-radius:14px;padding:30px;border:1px solid #1e2a45;line-height:1.8;font-size:.95em;color:#c0c8d6}
.content h2{color:#00d4ff;font-size:1.2em;margin:24px 0 12px}
.content h3{color:#e0e6ed;font-size:1.05em;margin:20px 0 10px}
.content p{margin-bottom:14px}
.content ul,.content ol{padding-left:24px;margin-bottom:14px}
.content li{margin-bottom:6px}
.content code{background:#1a2340;padding:2px 6px;border-radius:4px;font-size:.9em;color:#00ff88}
.content pre{background:#0f1625;padding:16px;border-radius:10px;overflow-x:auto;border:1px solid #1e2a45;margin-bottom:16px}
.content pre code{background:none;padding:0;color:#c0c8d6}
.content a{color:#00d4ff}
.content a:hover{color:#00ff88}
.content blockquote{border-left:3px solid #00d4ff;padding:10px 16px;margin:14px 0;background:#0f1625;border-radius:0 8px 8px 0;color:#8892a4}
.content img{max-width:100%;border-radius:8px;margin:14px 0}
.footer{text-align:center;padding:20px;color:#5a6a8a;font-size:.8em}
@media(max-width:600px){body{padding:12px}.header{padding:20px 14px}.header h1{font-size:1.2em}.content{padding:16px;font-size:.9em}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>{{ post.title }}</h1>
<div class="date">{{ post.date }}</div>
<a class="nav-link" href="/blog">&larr; Semua Postingan</a>
</div>
<div class="content">
{{ post.html|safe }}
</div>
<div class="footer"><p>My Home Server</p></div>
</div>
</body>
</html>
