<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ post.title }} - My Home Server</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:#080c18;color:#e2e8f0;min-height:100vh}
.container{max-width:740px;margin:0 auto;padding:32px 20px}
header{margin-bottom:40px}
header .back{display:inline-flex;align-items:center;gap:6px;color:#64748b;text-decoration:none;font-size:.85rem;padding:8px 14px;border-radius:8px;border:1px solid #1e293b;transition:all .2s;margin-bottom:20px}
header .back:hover{color:#60a5fa;border-color:#334155;background:#0f1729}
header h1{font-size:1.8rem;font-weight:700;letter-spacing:-.5px;line-height:1.3;background:linear-gradient(135deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header .meta{display:flex;align-items:center;gap:16px;margin-top:14px;font-size:.82rem;color:#64748b;flex-wrap:wrap}
header .meta span{display:flex;align-items:center;gap:5px}
article{background:linear-gradient(145deg,#0f1729,#0a0f1e);border-radius:16px;padding:40px;border:1px solid #1e293b}
article h2{color:#60a5fa;font-size:1.25rem;font-weight:600;margin:32px 0 12px;line-height:1.4}
article h3{color:#cbd5e1;font-size:1.1rem;font-weight:600;margin:28px 0 10px}
article h4{color:#94a3b8;font-size:1rem;font-weight:600;margin:24px 0 8px}
article p{font-size:.95rem;line-height:1.8;color:#cbd5e1;margin-bottom:18px}
article ul,article ol{padding-left:24px;margin-bottom:18px;font-size:.95rem;line-height:1.8;color:#cbd5e1}
article li{margin-bottom:6px}
article strong{color:#f1f5f9}
article a{color:#60a5fa;text-decoration:none;border-bottom:1px solid transparent;transition:all .2s}
article a:hover{border-bottom-color:#60a5fa}
article code{background:#1e293b;padding:3px 8px;border-radius:6px;font-size:.88em;color:#34d399;font-family:'JetBrains Mono','Fira Code',monospace}
article pre{background:#050914;padding:20px;border-radius:12px;overflow-x:auto;border:1px solid #1e293b;margin-bottom:20px;position:relative}
article pre code{background:none;padding:0;color:#e2e8f0;font-size:.85rem;line-height:1.6}
article blockquote{border-left:3px solid #60a5fa;padding:14px 20px;margin:20px 0;background:#0a0f1e;border-radius:0 10px 10px 0;color:#94a3b8;font-style:italic}
article img{max-width:100%;border-radius:10px;margin:20px 0;border:1px solid #1e293b}
article hr{border:none;height:1px;background:#1e293b;margin:32px 0}
article table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:.9rem}
article th,article td{padding:10px 14px;text-align:left;border:1px solid #1e293b}
article th{background:#0a0f1e;color:#60a5fa;font-weight:600}
article td{color:#94a3b8}
footer{text-align:center;padding:32px 20px 16px;color:#475569;font-size:.78rem;margin-top:40px}
footer a{color:#64748b;text-decoration:none}
footer a:hover{color:#60a5fa}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){.container{padding:20px 14px}header h1{font-size:1.35rem}article{padding:20px;font-size:.92rem}article h2{font-size:1.1rem}article pre{padding:14px}}
</style>
</head>
<body>
<div class="container">
<header class="fade-in">
<a class="back" href="/blog">&#8592; Kembali ke Blog</a>
<h1>{{ post.title }}</h1>
<div class="meta">
<span>&#128197; {{ post.date }}</span>
<span>&#128337; {{ post.read_time }} menit baca</span>
</div>
</header>
<article class="fade-in" style="animation-delay:.1s">
{{ post.html|safe }}
</article>
<footer>
<p>My Home Server &mdash; <a href="/blog">Kembali ke Blog</a></p>
</footer>
</div>
</body>
</html>
